<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SYN Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .feedback-container {
      background-color: #ffffff;
      padding: 32px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      max-width: 420px;
      width: 100%;
    }
    .feedback-container h2 {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      color: #222;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      font-size: 14px;
      color: #555;
      display: block;
      margin-bottom: 8px;
    }
    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      background-color: #fff;
      transition: border-color 0.2s;
    }
    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
      border-color: #007bff;
      outline: none;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-group input[type="submit"] {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }
    .form-group input[type="submit"]:hover {
      background-color: #0056b3;
    }
    .response-message {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }
    .response-message.success {
      color: green;
    }
    .response-message.error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="feedback-container">
    <h2>Share Your Feedback</h2>
    <form id="feedbackForm" method="POST" action="https://script.google.com/macros/s/AKfycbxFQYNTljAWe8wIXY5j6bMrYDGKpACkZxEJP_UcXhc79luWqeamDO_XkjVziHldjbafkQ/exec">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="userName" required />
      </div>
      <div class="form-group">
        <label for="feedback">Your Feedback</label>
        <textarea id="feedback" name="userFeedback" required></textarea>
      </div>
      <div class="form-group">
        <input type="submit" value="Submit Feedback" />
      </div>
      <div id="responseMessage" class="response-message"></div>
    </form>
  </div>

  <script>
    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const responseDiv = document.getElementById('responseMessage');
      responseDiv.textContent = 'Submitting...';
      responseDiv.className = 'response-message';

      fetch(form.action, {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.text();
      })
      .then(data => {
        responseDiv.textContent = data;
        if (data.includes("successfully")) {
          responseDiv.classList.add('success');
          form.reset();
        } else {
          responseDiv.classList.add('error');
        }
      })
      .catch(error => {
        responseDiv.textContent = 'An error occurred. Please try again.';
        responseDiv.classList.add('error');
      });
    });
  </script>
</body>
</html>
