<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centered Swami Image Popup</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f2f5;
      display: flex; /* Use flexbox for centering content */
      justify-content: center; /* Center horizontally */
      align-items: center; /* Center vertically */
      min-height: 100vh; /* Make sure body takes full viewport height */
    }

    .image-popup {
      position: relative; /* Changed from fixed to relative for simpler centering with flexbox on body */
      width: 90%;
      max-width: 420px; /* Constrain width */
      max-height: 80vh; /* Constrain height */
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      overflow: hidden; /* Hide overflow if image is slightly larger than container */
      display: flex; /* Use flexbox for image centering within popup */
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); } /* Scale effect for fadeIn */
      to { opacity: 1; transform: scale(1); }
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: rgba(0, 0, 0, 0.5); /* Semi-transparent background for better visibility */
      border: none;
      color: white;
      font-size: 24px; /* Larger for easier clicking */
      cursor: pointer;
      border-radius: 50%; /* Make it round */
      width: 30px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1; /* Adjust line-height for vertical alignment of 'x' */
      padding-bottom: 2px; /* Slight adjustment for 'x' */
    }

    .swami-image {
      width: 100%; /* Make image fill the popup width */
      height: auto; /* Maintain aspect ratio */
      display: block; /* Remove extra space below image */
      border-radius: 12px; /* Apply border-radius to image if it's the only content */
    }

    /* Adjust padding for responsiveness if needed */
    @media (max-width: 500px) {
      .image-popup {
        max-width: 95%; /* Use more width on smaller screens */
      }
    }
  </style>
</head>
<body>

<div class="image-popup">
  <img src="assets\img\portfolio\beautiful.png" alt="Beloved Swami" class="swami-image" />

  <button class="close-btn" onclick="parent.closeIntro()">×</button>
</div>

</body>
</html>
