<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thought for the Day</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #dailyImage {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px; /* This makes the corners round */
        }
        .back-link {
            margin-top: 20px;
            text-decoration: none;
            color: #333;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <img id="dailyImage" alt="No image found">

    <a href="index.html" class="back-link">Go back to Main Page</a>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const d = new Date();
            const monthNumber = d.getMonth();
            const day = d.getDate();
            let month;
            
            // This conditional logic handles the inconsistent file naming
            if (monthNumber === 5) {
                // June is month 5 (0-indexed)
                month = "June";
            } else if (monthNumber === 6) {
                // July is month 6
                month = "July";
            } else if (monthNumber === 7) {
                // August is month 7
                month = "Aug";
            } else if (monthNumber === 8) {
                // September is month 8
                month = "Sep";
            } else if (monthNumber === 9) {
                // October is month 9
                month = "Oct";
            } else if (monthNumber === 10) {
                // November is month 10
                month = "Nov";
            } else if (monthNumber === 11) {
                // November is month 10
                month = "Dec";
            } else {
                // Default to the full month name for all other months
                const monthNames = [
                    "January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"
                ];
                month = monthNames[monthNumber];
            }
            
            const filename = `${month} ${day}.png`;
            
            const imageElement = document.getElementById('dailyImage');
            imageElement.src = `assets/img/tod/${filename}`;

            imageElement.onerror = function() {
                this.alt = `No image found for ${month} ${day}`;
                this.src = '';
            };
        });
    </script>
</body>
</html>
